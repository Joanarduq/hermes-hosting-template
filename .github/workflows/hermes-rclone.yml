name: Hermes Rclone
on:
  workflow_dispatch:
  push:
    branches: [main, 'pilot/hermes-restore-diagnostics']
    paths: ['.github/workflows/hermes-rclone.yml', 'tests/two-tenants.sh', 'tests/restore-diagnostics.py']
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: hermes-rclone-${{ github.ref }}
  cancel-in-progress: false
jobs:
  restore:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtener fuente fijada de Rclone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rclone/rclone
          ref: be8d6044eacb843b74d335db0c5fbe09222031fe
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Compilar Hermes Rclone para Linux
        shell: bash
        run: |
          set -euo pipefail
          cat > hermes_main.go <<'GO'
          package main
          import (
              "github.com/rclone/rclone/cmd"
              _ "github.com/rclone/rclone/backend/local"
              _ "github.com/rclone/rclone/backend/crypt"
              _ "github.com/rclone/rclone/backend/union"
              _ "github.com/rclone/rclone/backend/s3"
              _ "github.com/rclone/rclone/cmd/copyto"
              _ "github.com/rclone/rclone/cmd/obscure"
              _ "github.com/rclone/rclone/cmd/version"
          )
          func main() { cmd.Main() }
          GO
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/hermes-rclone" hermes_main.go
          go mod verify
          "$RUNNER_TEMP/hermes-rclone" version
          sha256sum "$RUNNER_TEMP/hermes-rclone" >> "$GITHUB_STEP_SUMMARY"
      - name: Restaurar y comparar datos sintéticos
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          r="$RUNNER_TEMP/hermes-rclone"
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          mkdir "$d/a" "$d/b"
          export RCLONE_CONFIG="$d/rclone.conf"
          secret=$(openssl rand -hex 32 | "$r" obscure -)
          printf '[pool]\ntype = union\nupstreams = %s/a %s/b\ncreate_policy = ff\n[encrypted]\ntype = crypt\nremote = pool:\npassword = %s\n' "$d" "$d" "$secret" > "$RCLONE_CONFIG"
          head -c 1048576 /dev/urandom > "$d/original"
          "$r" copyto "$d/original" encrypted:probe
          "$r" copyto encrypted:probe "$d/restored"
          cmp "$d/original" "$d/restored"
          echo 'Restauración verificada byte por byte: 1 MiB, crypt sobre union local.' >> "$GITHUB_STEP_SUMMARY"
      - name: Obtener pruebas de Hermes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hermes-tests
          persist-credentials: false
      - name: Verificar dos clientes y cuota concurrente
        run: bash hermes-tests/tests/two-tenants.sh "$RUNNER_TEMP/hermes-rclone"
      - name: Comprobar diagnóstico de restauración y destino temporal
        run: python3 hermes-tests/tests/restore-diagnostics.py "$RUNNER_TEMP/hermes-rclone"
      - name: Descargar el respaldo de la ejecución de origen
        if: github.ref == 'refs/heads/pilot/hermes-restore-diagnostics' && github.event.head_commit.message == 'Verify retained Hermes fixture from run 43998087212'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hermes-historical-synthetic
          run-id: 43998087212
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/historical-vault
      - name: Verificar restauración entre ejecuciones
        if: github.ref == 'refs/heads/pilot/hermes-restore-diagnostics' && github.event.head_commit.message == 'Verify retained Hermes fixture from run 43998087212'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          r="$RUNNER_TEMP/hermes-rclone"
          # Public disposable credential for synthetic test data only.
          password=$(printf '%s' 'hermes-cross-run-public-fixture' | "$r" obscure -)
          export RCLONE_CONFIG="$RUNNER_TEMP/cross-run.conf"
          printf '[vault]\ntype = crypt\nremote = %s\npassword = %s\n' "$RUNNER_TEMP/historical-vault" "$password" > "$RCLONE_CONFIG"
          destination=$(mktemp -d)
          test "$(find "$RUNNER_TEMP/historical-vault" -type f | wc -l)" -eq 2
          for file in probe.bin origin.txt; do
            "$r" copyto "vault:$file" "$destination/$file"
          done
          cd "$destination"
          printf '%s  %s\n' '634709360e09f46c10fb20db2cd6eb445c5431e73b2bdf4cfda47a907d5d93f7' probe.bin '5533c2fcde267a70fa33e9759e9952b9f0f4532180bffee2a6d57df6b4e7838a' origin.txt | sha256sum --check --strict
          test "$(cat origin.txt)" = 'Hermes synthetic run 43998087212'
          echo 'HERMES_CROSS_RUN_OK source=43998087212 restored=2'
